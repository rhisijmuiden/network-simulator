name: CI

on:
  pull_request:
  push:
    branches: [production, test]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-i18n
      - run: npm run build
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning deploy/install.sh deploy/network-simulator-update deploy/network-simulator-restore deploy/network-simulator-cli
